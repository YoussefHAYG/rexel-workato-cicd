name: 🔄 Sync Workato Projects

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Fetch Projects & Update Deploy Dropdown
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_PUSH_TOKEN }}

      - name: Fetch Top-Level Projects from Workato
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.WORKATO_DEV_API_TOKEN }}" \
            "${{ vars.WORKATO_BASE_URL }}/api/folders" \
            | jq '[
                .[]
                | select(.parent_folder_id == null)
                | {
                    name: .name,
                    folder_id: (.id | tostring)
                  }
              ]' > .github/workato/projects.json

          echo "✅ Projects fetched:"
          jq -r '.[].name' .github/workato/projects.json

      - name: Update Dropdown Options in Deploy Workflow
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          projects_file = Path(".github/workato/projects.json")
          workflow_file = Path(".github/workflows/workato-deploy.yml")

          projects = json.loads(projects_file.read_text())
          options = "\n".join(
              f"          - {project['name']}"
              for project in projects
          )

          content = workflow_file.read_text()

          new_block = (
              "# AUTO-GENERATED START\n"
              "        options:\n"
              f"{options}\n"
              "          # AUTO-GENERATED END"
          )

          updated_content, replacements = re.subn(
              r"# AUTO-GENERATED START.*?# AUTO-GENERATED END",
              new_block,
              content,
              flags=re.DOTALL,
          )

          if replacements != 1:
              raise SystemExit(
                  "Expected exactly one AUTO-GENERATED block, "
                  f"but found {replacements}"
              )

          workflow_file.write_text(updated_content)
          print("✅ Deploy workflow updated with latest project options")
          PY

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workato/projects.json \
            .github/workflows/workato-deploy.yml

          if git diff --staged --quiet; then
            echo "No changes detected"
          else
            git commit -m "🔄 Sync Workato project dropdown [skip ci]"
            git push origin HEAD:main
          fi
