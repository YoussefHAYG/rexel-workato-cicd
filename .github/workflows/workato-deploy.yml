name: 🚀 Workato Deploy

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Project to deploy"
        required: true
        type: choice
        # AUTO-GENERATED START
        options:
          - AIRO Claude
          - Submit Integration Request
          - CICD Automation
          - RBT
          - FR_POC_API_SnowFlake_V1
          - FR_AB_API_TEMPLATE_V1
          - CH_POC_GENERIC_TEMPLATE_V1
          - 01-Common
          - Autonomous Operations Framework AOF
          - Templates
          - Automation Quality & Security AHQ
          - iPaaS POC
          - Spring
          - Finance
          # AUTO-GENERATED END
      target_env:
        description: "Target environment"
        required: true
        type: choice
        options:
          - TEST
          - PREPROD
          - PRODUCTION
      deployment_type:
        description: "Deployment type"
        required: true
        type: choice
        options:
          - RLCM
          - Project
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - Minor
          - Major
          - Bug Fixes
      feature_branch_name:
        description: "Feature branch name (must be unique)"
        required: true
        type: string
      requestor_email:
        description: "Requestor email"
        required: true
        type: string
      promote_properties:
        description: "Also promote project properties?"
        required: true
        type: choice
        options:
          - "yes"
          - "no"
      notes:
        description: "Deployment notes"
        required: false
        default: ""

env:
  WORKATO_BASE_URL: ${{ vars.WORKATO_BASE_URL }}
  CICD_API_BASE: https://apim.eu.workato.com/dev_rexel/cicd-automation-api-v1
  CICD_API_TOKEN: ${{ secrets.WORKATO_CICD_API_TOKEN }}

jobs:

  # ── 1. Resolve Project → Folder ID ──────────────────────
  resolve:
    name: "Resolve Project: ${{ github.event.inputs.project_name }}"
    runs-on: ubuntu-latest
    outputs:
      folder_id: ${{ steps.resolve.outputs.folder_id }}
      workspace_name: ${{ steps.resolve.outputs.workspace_name }}
    steps:
      - name: Fetch Projects from Workato & Resolve Folder ID
        id: resolve
        run: |
          PROJECT="${{ github.event.inputs.project_name }}"

          # Get workspace name (for CICD API payload)
          WS_RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.WORKATO_DEV_API_TOKEN }}" \
            "${{ env.WORKATO_BASE_URL }}/api/users/me")
          WORKSPACE_NAME=$(echo $WS_RESPONSE | jq -r '.team_name // .name')
          echo "workspace_name=$WORKSPACE_NAME" >> $GITHUB_OUTPUT
          echo "✅ Workspace: $WORKSPACE_NAME"

          # Resolve folder ID from project name
          FOLDERS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.WORKATO_DEV_API_TOKEN }}" \
            "${{ env.WORKATO_BASE_URL }}/api/folders")

          FOLDER_ID=$(echo $FOLDERS | jq -r \
            --arg name "$PROJECT" \
            '[.[] | select(.parent_folder_id == null)] | .[] | select(.name == $name) | .id | tostring')

          if [ -z "$FOLDER_ID" ] || [ "$FOLDER_ID" = "null" ]; then
            echo "❌ Project '$PROJECT' not found."
            echo "Available projects:"
            echo $FOLDERS | jq -r '[.[] | select(.parent_folder_id == null)] | .[].name'
            exit 1
          fi

          echo "folder_id=$FOLDER_ID" >> $GITHUB_OUTPUT
          echo "✅ '$PROJECT' → Folder ID: $FOLDER_ID"

  # ── 2. Promote Project Properties (optional) ────────────
  promote-properties:
    name: "Promote Project Properties (DEV → ${{ github.event.inputs.target_env }})"
    needs: resolve
    runs-on: ubuntu-latest
    if: github.event.inputs.promote_properties == 'yes'
    steps:
      - name: Call Workato Promote Properties API
        run: |
          TARGET="${{ github.event.inputs.target_env }}"
          FOLDER_ID="${{ needs.resolve.outputs.folder_id }}"
          WORKSPACE="${{ needs.resolve.outputs.workspace_name }}"

          RESPONSE=$(curl -s -X PUT \
            -H "Authorization: Bearer ${{ env.CICD_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"workspace_name\": \"$WORKSPACE\",
              \"source_environment\": \"DEV\",
              \"target_environment\": \"$TARGET\",
              \"project_asset_id\": \"$FOLDER_ID\"
            }" \
            "${{ env.CICD_API_BASE }}/promote-project-properties")

          echo "API Response: $RESPONSE"
          STATUS=$(echo $RESPONSE | jq -r '.status // .message // "unknown"')

          if echo $RESPONSE | jq -e '.error' > /dev/null 2>&1; then
            echo "❌ Property promotion failed: $RESPONSE"
            exit 1
          fi

          RECORD_ID=$(echo $RESPONSE | jq -r '.record_id // "N/A"')
          echo "✅ Properties promotion queued. Record ID: $RECORD_ID"

      - name: Summary
        run: |
          echo "### 🔧 Properties Promoted" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Project** | ${{ github.event.inputs.project_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **From** | DEV |" >> $GITHUB_STEP_SUMMARY
          echo "| **To** | ${{ github.event.inputs.target_env }} |" >> $GITHUB_STEP_SUMMARY

  # ── 3a. Build & Deploy to TEST ──────────────────────────
  deploy-test:
    name: "Deploy → TEST (Pending Approval)"
    needs: [resolve, promote-properties]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.resolve.result == 'success' &&
      github.event.inputs.target_env == 'TEST' &&
      (needs.promote-properties.result == 'success' || needs.promote-properties.result == 'skipped')
    environment: test      # 👈 Pauses for 1 reviewer approval
    steps:
      - name: Call Workato Build & Deploy to Test API
        id: deploy
        run: |
          FOLDER_ID="${{ needs.resolve.outputs.folder_id }}"
          WORKSPACE="${{ needs.resolve.outputs.workspace_name }}"

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ env.CICD_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"build_comments\": \"${{ github.event.inputs.notes }} | Run #${{ github.run_number }} by ${{ github.actor }}\",
              \"feature_branch_name\": \"${{ github.event.inputs.feature_branch_name }}\",
              \"deployment_type\": \"${{ github.event.inputs.deployment_type }}\",
              \"workspace_name\": \"$WORKSPACE\",
              \"release_type\": \"${{ github.event.inputs.release_type }}\",
              \"asset_id\": \"$FOLDER_ID\",
              \"requestor_email\": \"${{ github.event.inputs.requestor_email }}\"
            }" \
            "${{ env.CICD_API_BASE }}/build-and-deploy-to-test")

          echo "API Response: $RESPONSE"

          if echo $RESPONSE | jq -e '.error' > /dev/null 2>&1; then
            echo "❌ Deployment failed: $RESPONSE"
            exit 1
          fi

          RECORD_ID=$(echo $RESPONSE | jq -r '.record_id // "N/A"')
          echo "record_id=$RECORD_ID" >> $GITHUB_OUTPUT
          echo "✅ Deployment queued. Record ID: $RECORD_ID"

      - name: Deployment Summary
        run: |
          echo "## ✅ Build & Deploy to TEST Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Project** | ${{ github.event.inputs.project_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.event.inputs.feature_branch_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Type** | ${{ github.event.inputs.release_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment Type** | ${{ github.event.inputs.deployment_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Requestor** | ${{ github.event.inputs.requestor_email }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Record ID** | ${{ steps.deploy.outputs.record_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Run** | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY

  # ── 3b. Deploy to PREPROD / PRODUCTION ──────────────────
  deploy-prod:
    name: "Deploy → ${{ github.event.inputs.target_env }} (Pending Approval)"
    needs: [resolve, promote-properties]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.resolve.result == 'success' &&
      (github.event.inputs.target_env == 'PREPROD' || github.event.inputs.target_env == 'PRODUCTION') &&
      (needs.promote-properties.result == 'success' || needs.promote-properties.result == 'skipped')
    environment: ${{ github.event.inputs.target_env == 'PRODUCTION' && 'prod' || 'preprod' }}
    steps:
      - name: Call Workato Deploy API
        id: deploy
        run: |
          FOLDER_ID="${{ needs.resolve.outputs.folder_id }}"
          WORKSPACE="${{ needs.resolve.outputs.workspace_name }}"
          TARGET="${{ github.event.inputs.target_env }}"

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ env.CICD_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"deployment_comments\": \"${{ github.event.inputs.notes }} | Run #${{ github.run_number }} by ${{ github.actor }}\",
              \"workspace_name\": \"$WORKSPACE\",
              \"release_details_record_id\": \"$FOLDER_ID\",
              \"target_environment\": \"$TARGET\"
            }" \
            "${{ env.CICD_API_BASE }}/deploy")

          echo "API Response: $RESPONSE"

          if echo $RESPONSE | jq -e '.error' > /dev/null 2>&1; then
            echo "❌ Deployment failed: $RESPONSE"
            exit 1
          fi

          RECORD_ID=$(echo $RESPONSE | jq -r '.record_id // "N/A"')
          echo "record_id=$RECORD_ID" >> $GITHUB_OUTPUT
          echo "✅ Deployment queued. Record ID: $RECORD_ID"

      - name: Deployment Summary
        run: |
          echo "## ✅ Deployed to ${{ github.event.inputs.target_env }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Project** | ${{ github.event.inputs.project_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${{ github.event.inputs.target_env }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Record ID** | ${{ steps.deploy.outputs.record_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Run** | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Notes** | ${{ github.event.inputs.notes }} |" >> $GITHUB_STEP_SUMMARY
