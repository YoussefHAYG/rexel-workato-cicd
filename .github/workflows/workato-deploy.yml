name: 🚀 Workato Deploy

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Project to deploy"
        required: true
        type: choice
        # AUTO-GENERATED START
        options:
          - AIRO Claude
          - Submit Integration Request
          - CICD Automation
          - RBT
          - FR_POC_API_SnowFlake_V1
          - FR_AB_API_TEMPLATE_V1
          - CH_POC_GENERIC_TEMPLATE_V1
          - 01-Common
          - Autonomous Operations Framework AOF
          - Templates
          - Automation Quality & Security AHQ
          - iPaaS POC
          - Spring
          - Finance
          # AUTO-GENERATED END
      target_env:
        description: "Target environment"
        required: true
        type: choice
        options:
          - test
          - prod
      promote_properties:
        description: "Also promote project properties?"
        required: true
        type: choice
        options:
          - "yes"
          - "no"
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - Minor
          - Major
          - Bug Fixes
      notes:
        description: "Deployment notes"
        required: false
        default: ""

env:
  WORKATO_BASE_URL: ${{ vars.WORKATO_BASE_URL }}

jobs:

  # ── 1. Resolve Project → Folder ID ──────────────────────
  resolve:
    name: "Resolve: ${{ github.event.inputs.project_name }}"
    runs-on: ubuntu-latest
    outputs:
      folder_id: ${{ steps.resolve.outputs.folder_id }}
    steps:
      - name: Fetch Projects & Resolve Folder ID
        id: resolve
        run: |
          PROJECT="${{ github.event.inputs.project_name }}"

          FOLDERS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.WORKATO_DEV_API_TOKEN }}" \
            "${{ env.WORKATO_BASE_URL }}/api/folders")

          FOLDER_ID=$(echo $FOLDERS | jq -r \
            --arg name "$PROJECT" \
            '[.[] | select(.parent_folder_id == null)] | .[] | select(.name == $name) | .id | tostring')

          if [ -z "$FOLDER_ID" ] || [ "$FOLDER_ID" = "null" ]; then
            echo "❌ Project '$PROJECT' not found."
            echo "Available projects:"
            echo $FOLDERS | jq -r '[.[] | select(.parent_folder_id == null)] | .[].name'
            exit 1
          fi

          echo "folder_id=$FOLDER_ID" >> $GITHUB_OUTPUT
          echo "✅ '$PROJECT' → Folder ID: $FOLDER_ID"

  # ── 2. Promote Project Properties (optional) ────────────
  promote-properties:
    name: "Promote Properties → ${{ github.event.inputs.target_env }}"
    needs: resolve
    runs-on: ubuntu-latest
    if: github.event.inputs.promote_properties == 'yes'
    steps:
      - name: Read Properties from DEV
        id: read
        run: |
          FOLDER_ID="${{ needs.resolve.outputs.folder_id }}"

          # Fetch all project properties from DEV using folder (project) scope
          PROPS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.WORKATO_DEV_API_TOKEN }}" \
            "${{ env.WORKATO_BASE_URL }}/api/properties?prefix=project_${FOLDER_ID}_")

          echo "Properties fetched from DEV:"
          echo $PROPS | jq .

          # Save to file for next step
          echo $PROPS > dev_properties.json

      - name: Write Properties to Target
        run: |
          TARGET_ENV="${{ github.event.inputs.target_env }}"

          # Select correct token for target
          if [ "$TARGET_ENV" = "test" ]; then
            TARGET_TOKEN="${{ secrets.WORKATO_TEST_API_TOKEN }}"
          else
            TARGET_TOKEN="${{ secrets.WORKATO_PROD_API_TOKEN }}"
          fi

          # Read properties saved from DEV
          PROPS=$(cat dev_properties.json)
          COUNT=$(echo $PROPS | jq 'length')

          if [ "$COUNT" = "0" ] || [ "$COUNT" = "null" ]; then
            echo "ℹ️ No properties found for this project in DEV. Skipping."
            exit 0
          fi

          echo "Promoting $COUNT properties to $TARGET_ENV..."

          # Upsert each property into target environment
          echo $PROPS | jq -c '.[]' | while read PROP; do
            NAME=$(echo $PROP | jq -r '.name')
            VALUE=$(echo $PROP | jq -r '.value')

            curl -s -X POST \
              -H "Authorization: Bearer $TARGET_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\": \"$NAME\", \"value\": \"$VALUE\"}" \
              "${{ env.WORKATO_BASE_URL }}/api/properties" > /dev/null

            echo "  ✅ Promoted: $NAME"
          done

          echo "✅ All $COUNT properties promoted to $TARGET_ENV"

      - name: Summary
        run: |
          echo "### 🔧 Properties Promoted" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Project** | ${{ github.event.inputs.project_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **From** | DEV |" >> $GITHUB_STEP_SUMMARY
          echo "| **To** | ${{ github.event.inputs.target_env }} |" >> $GITHUB_STEP_SUMMARY

  # ── 3. Export Package from DEV ──────────────────────────
  export:
    name: "Export Package from DEV"
    needs: [resolve, promote-properties]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.resolve.result == 'success' &&
      (needs.promote-properties.result == 'success' || needs.promote-properties.result == 'skipped')
    outputs:
      package_id: ${{ steps.export.outputs.package_id }}
    steps:
      - name: Create Export Manifest
        id: manifest
        run: |
          PROJECT="${{ github.event.inputs.project_name }}"
          FOLDER_ID="${{ needs.resolve.outputs.folder_id }}"

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.WORKATO_DEV_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"export_manifest\": {
                \"name\": \"$PROJECT - ${{ github.event.inputs.release_type }} - Run ${{ github.run_number }}\",
                \"folder_id\": $FOLDER_ID,
                \"auto_generate_assets\": true,
                \"include_tags\": true
              }
            }" \
            "${{ env.WORKATO_BASE_URL }}/api/export_manifests")

          MANIFEST_ID=$(echo $RESPONSE | jq -r '.id')

          if [ -z "$MANIFEST_ID" ] || [ "$MANIFEST_ID" = "null" ]; then
            echo "❌ Failed to create manifest."
            echo "Response: $RESPONSE"
            exit 1
          fi

          echo "manifest_id=$MANIFEST_ID" >> $GITHUB_OUTPUT
          echo "✅ Manifest created: $MANIFEST_ID"

      - name: Trigger Package Export
        id: export
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.WORKATO_DEV_API_TOKEN }}" \
            "${{ env.WORKATO_BASE_URL }}/api/packages/export/${{ steps.manifest.outputs.manifest_id }}")

          PACKAGE_ID=$(echo $RESPONSE | jq -r '.id')

          if [ -z "$PACKAGE_ID" ] || [ "$PACKAGE_ID" = "null" ]; then
            echo "❌ Failed to trigger export."
            echo "Response: $RESPONSE"
            exit 1
          fi

          echo "package_id=$PACKAGE_ID" >> $GITHUB_OUTPUT
          echo "✅ Export triggered: Package ID $PACKAGE_ID"

      - name: Wait for Export to Complete
        run: |
          PACKAGE_ID="${{ steps.export.outputs.package_id }}"
          STATUS="pending"
          RETRIES=0

          while [ "$STATUS" != "completed" ] && [ $RETRIES -lt 24 ]; do
            sleep 10
            RESPONSE=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.WORKATO_DEV_API_TOKEN }}" \
              "${{ env.WORKATO_BASE_URL }}/api/packages/$PACKAGE_ID")
            STATUS=$(echo $RESPONSE | jq -r '.status')
            RETRIES=$((RETRIES+1))
            echo "⏳ Status: $STATUS (attempt $RETRIES/24)"
          done

          if [ "$STATUS" != "completed" ]; then
            echo "❌ Export timed out after 4 minutes."
            exit 1
          fi

          echo "✅ Export completed"

      - name: Download Package
        run: |
          curl -s -o package.zip \
            -H "Authorization: Bearer ${{ secrets.WORKATO_DEV_API_TOKEN }}" \
            "${{ env.WORKATO_BASE_URL }}/api/packages/${{ steps.export.outputs.package_id }}/download"

          SIZE=$(du -sh package.zip | cut -f1)
          echo "✅ Package downloaded: $SIZE"

      - name: Upload as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: workato-package-${{ github.run_id }}
          path: package.zip
          retention-days: 30

  # ── 4. Deploy to TEST ───────────────────────────────────
  deploy-test:
    name: "Deploy → TEST (Pending Approval)"
    needs: [resolve, export]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.export.result == 'success' &&
      github.event.inputs.target_env == 'test'
    environment: test      # 👈 Pauses for 1 reviewer approval
    steps:
      - name: Download Package
        uses: actions/download-artifact@v4
        with:
          name: workato-package-${{ github.run_id }}

      - name: Import Package to TEST
        run: |
          FOLDER_ID="${{ needs.resolve.outputs.folder_id }}"

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.WORKATO_TEST_API_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @package.zip \
            "${{ env.WORKATO_BASE_URL }}/api/packages/import/$FOLDER_ID?restart_recipes=true")

          echo "Response: $RESPONSE"
          STATUS=$(echo $RESPONSE | jq -r '.status // "unknown"')

          if [ "$STATUS" = "failed" ]; then
            echo "❌ Import to TEST failed."
            exit 1
          fi

          echo "✅ Imported to TEST. Status: $STATUS"

          # Show per-recipe import results
          echo ""
          echo "📋 Recipe import results:"
          echo $RESPONSE | jq -r '.recipe_imports[]? | "  " + .status + " → " + .recipe.name' 2>/dev/null || true

      - name: Deployment Summary
        run: |
          echo "## ✅ Deployed to TEST" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Project** | ${{ github.event.inputs.project_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Type** | ${{ github.event.inputs.release_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Properties Promoted** | ${{ github.event.inputs.promote_properties }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Run** | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Notes** | ${{ github.event.inputs.notes }} |" >> $GITHUB_STEP_SUMMARY

  # ── 5. Deploy to PROD ───────────────────────────────────
  deploy-prod:
    name: "Deploy → PROD (Pending Approval)"
    needs: [resolve, export]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.export.result == 'success' &&
      github.event.inputs.target_env == 'prod'
    environment: prod      # 👈 Pauses for 2 reviewer approvals
    steps:
      - name: Download Package
        uses: actions/download-artifact@v4
        with:
          name: workato-package-${{ github.run_id }}

      - name: Import Package to PROD
        run: |
          FOLDER_ID="${{ needs.resolve.outputs.folder_id }}"

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.WORKATO_PROD_API_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @package.zip \
            "${{ env.WORKATO_BASE_URL }}/api/packages/import/$FOLDER_ID?restart_recipes=true")

          echo "Response: $RESPONSE"
          STATUS=$(echo $RESPONSE | jq -r '.status // "unknown"')

          if [ "$STATUS" = "failed" ]; then
            echo "❌ Import to PROD failed."
            exit 1
          fi

          echo "✅ Imported to PROD. Status: $STATUS"

          # Show per-recipe import results
          echo ""
          echo "📋 Recipe import results:"
          echo $RESPONSE | jq -r '.recipe_imports[]? | "  " + .status + " → " + .recipe.name' 2>/dev/null || true

      - name: Deployment Summary
        run: |
          echo "## ✅ Deployed to PROD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Project** | ${{ github.event.inputs.project_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Type** | ${{ github.event.inputs.release_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Properties Promoted** | ${{ github.event.inputs.promote_properties }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Run** | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Notes** | ${{ github.event.inputs.notes }} |" >> $GITHUB_STEP_SUMMARY
